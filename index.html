<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff8ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Doodle Impostor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff8ec; --ink:#2a2238; --muted:#776d86; --line:#eadcc6; --card:#ffffff;
  --red:#ff5a3c; --red-d:#cf3a1f; --teal:#14a68c; --teal-d:#0c7a66; --imp:#7b4dff; --imp-d:#5530d6;
  --gold:#ffbf2e; --shadow:0 3px 0 rgba(42,34,56,.10); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper) radial-gradient(rgba(42,34,56,.07) 1px,transparent 1.3px) 0 0/18px 18px;color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,.big,.code,.btn,.timer,.word,.seg button,.logo{font-family:"Baloo 2",system-ui,sans-serif}
h1{font-size:34px;line-height:1.05;margin:6px 0 4px}
h2{font-size:24px;line-height:1.15;margin:4px 0 8px}
h3{font-size:18px;margin:2px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:rgba(255,248,236,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
#me{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Baloo 2",system-ui;font-size:19px}
#right{display:flex;gap:6px;align-items:center}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(30px + env(safe-area-inset-bottom))}
body.tv main{max-width:1180px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:11px 16px;font-size:21px;font-weight:800;color:#fff;background:var(--red);
  box-shadow:0 4px 0 var(--red-d);cursor:pointer;margin:10px 0;touch-action:manipulation;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 var(--teal-d)}
.btn.imp{background:var(--imp);box-shadow:0 4px 0 var(--imp-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{font-size:16px;padding:7px 12px;border-radius:12px;width:auto;display:inline-block;margin:4px 0}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.icon{border:2px solid var(--line);background:#fff;border-radius:12px;min-width:38px;height:38px;font-size:18px;cursor:pointer;padding:0 8px;color:var(--ink);line-height:1}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block;flex:none}
.dot.ok{background:#2fbf5b}.dot.bad{background:#e8322c}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.logo{font-size:44px;font-weight:800;line-height:1;margin:18px 0 2px;text-align:center}
.logo span{display:inline-block;transform:rotate(-3deg);color:var(--red)}
.logo b{display:inline-block;transform:rotate(2deg);color:var(--imp)}
.tag{text-align:center;color:var(--muted);margin:2px 0 14px}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input.t,textarea.t{width:100%;font:inherit;font-size:20px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
input.t:focus,textarea.t:focus{border-color:var(--teal)}
input.code-in{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:30px}
textarea.t{font-size:16px;min-height:90px}
.code{font-size:46px;font-weight:800;letter-spacing:7px;line-height:1;text-align:center}
.qr{display:block;margin:8px auto;width:190px;height:190px;background:#fff;border-radius:10px}
body.tv .qr{width:300px;height:300px}
.qr svg{display:block;width:100%;height:100%}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-weight:700}
.chip.off{opacity:.45}
.chip .x{border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;padding:0 2px}
.av{width:28px;height:28px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;font-family:"Baloo 2",system-ui,sans-serif}
.seg{display:flex;background:#f3ead9;border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:6px 6px;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;min-width:44px}
.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line)}
.seg button:disabled{cursor:default}
select.t{width:100%;font:inherit;font-size:17px;padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.set{display:grid;grid-template-columns:1fr;gap:4px}
.set .k{font-weight:700;font-size:15px;margin-top:8px}
.seg{flex-wrap:nowrap}
.btn{scroll-margin:90px}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.summary span{background:#f3ead9;border-radius:10px;padding:3px 9px;font-size:14px;font-weight:600}
/* secret card */
.secret{position:relative;min-height:220px;border-radius:24px;background:#2a2238;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;cursor:pointer;touch-action:none;margin:12px 0;box-shadow:0 5px 0 #15101e}
.secret .cover{font-family:"Baloo 2",system-ui,sans-serif;font-size:24px;font-weight:800}
.secret .word{font-size:46px;font-weight:800;line-height:1;margin:6px 0;color:#ffd84a;word-break:break-word}
.secret .lbl{opacity:.8;font-size:15px}
.peek{display:flex;align-items:center;justify-content:center;gap:8px;background:#2a2238;color:#fff;border-radius:14px;padding:9px 12px;margin:10px 0;
  font-weight:700;cursor:pointer;touch-action:none;min-height:44px;text-align:center}
.peek b{color:#ffd84a}
/* drawing */
.turnbar{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.turnbar .who{flex:1;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.1}
.timer{font-size:30px;font-weight:800;min-width:48px;text-align:right}
.timer.low{color:var(--red)}
.tbar{height:9px;border-radius:9px;background:#efe3cf;overflow:hidden;margin:2px 0 8px}
.tbar i{display:block;height:100%;background:var(--teal);width:100%;transition:width .2s linear}
.tbar.low i{background:var(--red)}
.order{display:flex;gap:4px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.order .av{width:30px;height:30px;opacity:.35;border:3px solid transparent}
.order .av.now{opacity:1;border-color:var(--ink);transform:scale(1.1)}
.order .av.done{opacity:.9}
.boardwrap{position:relative;background:#fff;border-radius:18px;border:3px solid var(--ink);overflow:hidden;box-shadow:0 4px 0 rgba(42,34,56,.15);aspect-ratio:1}
.boardwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.boardwrap.mine{border-color:var(--teal)}
.boardwrap .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-family:"Baloo 2",system-ui,sans-serif;font-size:26px;font-weight:800;text-align:center;padding:20px}
body.tv .boardwrap{max-width:calc(100vh - 230px);margin:0 auto}
body.tv .drawgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.tools{display:flex;gap:6px;margin:10px 0 6px}
.tools button{flex:1;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.tools button.on{border-color:var(--ink);background:#fff3c4}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.colors button{aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;touch-action:manipulation;padding:0}
.colors button.on{outline:3px solid var(--ink);outline-offset:2px}
.sizes{display:flex;gap:6px;margin-top:8px}
.sizes button{flex:1;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.sizes button.on{border-color:var(--ink);background:#fff3c4}
.sizes i{display:block;border-radius:50%;background:var(--ink)}
.gal{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.thumb{flex:none;width:96px;text-align:center;font-size:13px;font-weight:700;cursor:pointer}
.thumb img,.thumb .ph{display:block;width:96px;height:96px;border-radius:12px;border:2px solid var(--line);background:#fff;object-fit:cover}
.thumb .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
.thumb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
body.tv .thumb{width:140px} body.tv .thumb img, body.tv .thumb .ph{width:140px;height:140px}
/* vote */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.tv .vgrid{grid-template-columns:repeat(4,1fr)}
.vcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}
.vcard.pick{border-color:var(--red);background:#fff1ec}
.vcard .nm{display:flex;align-items:center;gap:6px;font-weight:800;min-width:0}
.vcard .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .pics{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vcard .pics.one{grid-template-columns:1fr}
.vcard .pics img,.vcard .pics .ph{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:zoom-in;display:block}
.vcard .pics .ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.vcard .btn{margin:2px 0 0;font-size:17px;padding:7px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices .btn{margin:0;font-size:18px;padding:10px 6px;text-transform:none}
.choices .btn.right{background:var(--teal);box-shadow:0 4px 0 var(--teal-d);opacity:1}
.choices .btn.wrong{background:#8b8494;box-shadow:0 4px 0 #625b6b;opacity:1}
/* results */
.reveal{text-align:center;border-radius:24px;padding:18px 14px;color:#fff;background:var(--imp);box-shadow:0 5px 0 var(--imp-d);margin:10px 0}
.reveal.crew{background:var(--teal);box-shadow:0 5px 0 var(--teal-d)}
.reveal.none{background:#8b8494;box-shadow:0 5px 0 #625b6b}
.reveal .big{font-size:30px;font-weight:800;line-height:1.1}
.reveal .w{display:inline-block;background:rgba(255,255,255,.2);border-radius:12px;padding:2px 12px;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:26px;margin-top:6px}
.score{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed var(--line)}
.score:last-child{border-bottom:0}
.score .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .p{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:22px}
.score .g{font-weight:800;color:var(--teal);min-width:34px;text-align:right}
.votes{font-size:15px;line-height:1.7}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 6px}
.podium>div{flex:1;max-width:120px;line-height:1.2;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:center;border-radius:14px 14px 0 0;color:#fff;padding:8px 4px;font-weight:800;font-family:"Baloo 2",system-ui,sans-serif}
.podium .n{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twist{background:#e9e1ff;border:2px solid #cbb8ff;border-radius:16px;padding:10px 12px;margin:8px 0;text-align:center}
.secret .role{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:24px;color:#ff8fb1;margin-bottom:4px}
.sablayer{position:absolute;inset:0;pointer-events:none}
.boardwrap .over.blind{background:#2a2238;color:#fff;pointer-events:none;z-index:2}
.sabbar{background:#2a2238;color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0}
.sabbar .colors{margin:8px 0 2px}
.tbar.sab{background:#4a3f5c}.tbar.sab i{background:#ff5fa2;transition:none}
.vb{width:100%;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);touch-action:manipulation}
.vb.on.imp{background:var(--red);border-color:var(--red-d);color:#fff}
.vb.on.sab{background:var(--imp);border-color:var(--imp-d);color:#fff}
.vb.on.best{background:var(--gold);border-color:#d99a00}
.vcard .you{text-align:center;color:var(--muted);font-weight:700;font-size:14px;padding:6px}
.myvotes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:4px 0;font-size:14px}
.mv{background:#f3ead9;border-radius:10px;padding:3px 8px;font-weight:600}
.mv.set.imp{background:#ffd9d0}.mv.set.sab{background:#e4dbff}.mv.set.best{background:#ffeab0}
.reveal.sabr{background:#2a2238;box-shadow:0 5px 0 #15101e}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:50;
  font-weight:700;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.banner{background:#fff3c4;border:2px solid #f1d77a;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:600;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(30,24,40,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--paper);border-radius:22px;padding:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal img{width:100%;border-radius:14px;border:2px solid var(--line);background:#fff;display:block}
.rules li{margin:4px 0}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:4px 0}
.wobble{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pulse{animation:pul 1s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<header><div id="me">🕵️ Doodle Impostor</div><div id="right"></div></header>
<main id="main"></main>

  return s;
}

// =====================================================================
//  CLIENT — every device (host included) uses this to show the game.
// =====================================================================
const C = {
  screen: "home", code: "", me: null, isHost: false, tv: false, conn: null,
  st: null, stAt: 0, priv: null, gal: {}, galRid: "", live: null, my: null,
  lastHello: 0, lastPing: 0, lastNeed: 0, joinAt: 0, key: "", upd: null,
};
function sendHost(m) {
  m.id = C.me?.id || m.id;

}
function setDot(up) { const d = $("#cdot"); if (d) d.className = "dot " + (up ? "ok" : "bad"); C.up = up; }

function joinRoom(code, name, tv) {
  C.conn?.close();

  C.code = code; C.tv = !!tv; C.isHost = false; C.screen = "room";
  C.st = null; C.priv = null; C.gal = {}; C.galRid = ""; C.live = null; C.my = null; C.joinAt = now();
  if (!tv) {
    const saved = store.get("di_player");
    const id = saved && saved.code === code ? saved.id : rid(8);
    C.me = { id, name };
    store.set("di_player", { code, id, name, ts: now() });
  } else C.me = { id: "tv" + rid(4), name: "TV" };
  document.body.classList.toggle("tv", !!tv);
  const top = TOP(code);
  C.conn = relay(brokerFor(code), {
    onStatus(up) { setDot(up); if (up) hello(true); },
    onMessage(topic, m) {
      if (topic === top + "/s") onState(m);
      else if (topic === top + "/d") { if (m.by !== C.me.id) onDraw(m); }
      else if (topic === top + "/g") onGal(m);
      else if (topic === top + "/p/" + C.me.id) onPriv(m);

}
function hello(force) {

  C.lastHello = now();
  sendHost({ t: "hello", name: C.me.name, tv: C.tv || undefined });
}
function onState(st) {
  if (!st || (C.st && st.hid === C.st.hid && st.v < C.st.v && !C.isHost)) return;
  const prev = C.st;
  C.st = st; C.stAt = now();
  if (st.lang !== LANG) LANG = st.lang;
  if (st.rid !== C.galRid) { C.gal = {}; C.galRid = st.rid; C.live = null; C.liveSab = null; }
  if (!C.isHost && !C.tv && !st.players.some((p) => p.id === C.me.id)) {
    if (now() - C.joinAt > 1500) hello();
  }
  // turn changed while I was drawing → wrap it up
  if (C.my && !C.my.fin && (st.rid !== C.my.rid || st.k !== C.my.k || st.phase !== "draw")) finishMyTurn();
  if (C.mySab && !C.mySab.fin && (st.rid !== C.mySab.rid || st.k !== C.mySab.k || st.phase !== "draw")) finishSab();
  // copy the finished live drawing into the gallery straight away
  if (prev && prev.rid === st.rid && C.live && C.live.k < st.done && !C.gal[C.live.k]) {
    const sb = C.liveSab && C.liveSab.k === C.live.k ? C.liveSab.tok.slice() : null;
    C.gal[C.live.k] = { pid: st.order[C.live.k], tok: C.live.tok.slice(), sab: sb, prov: true };
  }
  if (prev && prev.phase !== st.phase) {
    if (st.phase === "reveal") { beep(520, .15); beep(780, .2); buzz(80); }
    if (st.phase === "vote") { beep(440, .15); buzz(60); }
    if (st.phase === "result") beep(880, .25);
  }
  if (st.phase === "draw" && (!prev || prev.k !== st.k || prev.rid !== st.rid) && st.order[st.k] === C.me?.id) { beep(700, .12); setTimeout(() => beep(990, .18), 140); buzz([60, 40, 60]); }

}
function onPriv(m) {
  if (!m) return;

  else if (m.t === "resume") {
    const my = C.my;
    if (!my || my.fin || my.rid !== m.rid || my.k !== m.k || my.resumed || !m.tok.length) return;
    my.resumed = true;
    const tok = m.tok.concat([OP_E], my.tok);
    my.tok = tok; my.board.load(tok);

function onDraw(m) {

    // someone's sabotage layer (we don't know whose — that's the point)
    if (C.mySab && C.mySab.key === m.sab) return;
    if (C.liveSab && m.k < C.liveSab.k) return;

  render();
}

// ---- my drawing turn ----
function myInputOpts() {
  return C.st.twist === "oneline" ? { oneStroke: true, onStroke: () => setTimeout(() => { finishMyTurn(); render(); }, 500) } : {};
}
function startMyTurn(board) {
  const st = C.st;
  C.my = { rid: st.rid, k: st.k, board, tok: [], sent: 0, lastSnap: now(), snapLen: 0, fin: false };
  board.enableInput((arr) => { if (C.my && C.my.board === board && !C.my.fin) C.my.tok.push(...arr); }, myInputOpts());
  clearInterval(C.my.flushT);
  C.my.flushT = setInterval(flushMyTurn, 100);
}

}
function flushMyTurn() {
  const my = C.my;

  if (my.tok.length > my.sent) {
    pubDraw({ rid: my.rid, k: my.k, from: my.sent, tok: my.tok.slice(my.sent) });
    my.sent = my.tok.length;
  }
  if (now() - my.lastSnap > 2500 && my.snapLen !== my.tok.length) {

  my.board.stop?.();
  flushMyTurn();
  my.fin = true; clearInterval(my.flushT);
  C.gal[my.k] = C.gal[my.k] || { pid: C.me.id, tok: my.tok.slice(), prov: true };
  pubDraw({ rid: my.rid, k: my.k, fin: true, tok: my.tok });
  // send the final copy twice in case one gets lost
  setTimeout(() => { if (C.st && C.st.rid === my.rid) pubDraw({ rid: my.rid, k: my.k, fin: true, tok: my.tok }); }, 900);

  m = modal(el("h2", {}, "😈 " + t("sabPick", { name: pName(st.order[k]) })),
    el("button", { class: "btn imp", onclick: () => go("add") }, t("sabAdd")),

// ---- client timer loop ----
const deadline = () => C.st ? C.stAt + (C.st.left || 0) : 0;
function clientTick() {

  if (C.screen === "room" && C.code) {
    if (!C.isHost) {
      if (!st) hello();
      else if (now() - C.stAt > 12000) { $("#hostBanner") || $("#main").prepend(el("div", { class: "banner", id: "hostBanner" }, "⏳ " + t("hostBack"))); hello(); }
      else $("#hostBanner")?.remove();
      if (!C.tv && now() - C.lastPing > 5000) { C.lastPing = now(); sendHost({ t: "ping" }); }
      if (st && !C.tv && C.priv?.rid !== st.rid && ["reveal", "draw", "vote", "guess"].includes(st.phase) && st.parts.includes(C.me.id)) hello();
    }
    if (st && ["draw", "vote", "guess", "result"].includes(st.phase) && !C.isHost) {
      const miss = [];
      for (let k = 0; k < st.done; k++) if (!C.gal[k] || C.gal[k].prov) miss.push(k);
      if (miss.length && now() - C.lastNeed > 3000 && now() - C.stAt < 12000) { C.lastNeed = now(); sendHost({ t: "need", ks: miss }); }
    }

  }
  tickFrame();
}
let lastTickSec = -1;
function tickFrame() {
  const st = C.st;

  const left = Math.max(0, deadline() - now()), s = Math.ceil(left / 1000);
  document.querySelectorAll(".timer").forEach((e) => { e.textContent = s; e.classList.toggle("low", s <= 5); });
  document.querySelectorAll(".tbar").forEach((e) => { e.firstChild.style.width = (100 * left) / st.total + "%"; e.classList.toggle("low", s <= 5); });
  if (st.phase === "draw" && s !== lastTickSec) {
    lastTickSec = s;
    if (s <= 5 && s > 0) beep(st.order[st.k] === C.me?.id ? 880 : 600, 0.06, 0.08);
  }
  if (C.my && !C.my.fin && st.phase === "draw" && st.k === C.my.k && left <= 0) { finishMyTurn(); render(); }
  if (C.mySab && !C.mySab.fin) {
    const sl = Math.max(0, C.mySab.endAt - now());
    const e = $("#sabTime"); if (e) e.textContent = Math.ceil(sl / 1000) + "s";

}
setInterval(clientTick, 150);

  C.sabBoard = overlay;
  // sabotage layer for this drawing (from someone else, or my own)
  if (C.mySab && C.mySab.rid === st.rid && C.mySab.k === st.k) overlay.load(C.mySab.tok);
  else {
    if (!C.liveSab || C.liveSab.k !== st.k) C.liveSab = { k: st.k, tok: [], board: null };
    overlay.load(C.liveSab.tok);
    C.liveSab.board = overlay;
  }
  const nxt = st.order[st.k + 1];
  const who = el("div", { class: "who" }, mine ? t("yourTurn") : t("isDrawing", { name: dp?.name || "?" }));
  const top = el("div", {},
    el("div", { class: "muted small" }, roundLabel() + " · " + t("turnN", { n: st.k + 1, m: st.order.length }) +
      (st.twist && st.twist !== "none" ? " · " + twistLabel(st.twist) : "")),
    el("div", { class: "turnbar" }, mine ? null : avatar(dp), who, el("div", { class: "timer" }, "")),
    el("div", { class: "tbar" }, el("i")),
    el("div", { class: "order" }, st.order.map((id, i) => avatar(pObj(id) || { name: "?", col: 0 }, i === st.k ? "now" : i < st.k ? "done" : ""))),
    nxt && !mine ? el("div", { class: "small muted" }, nxt === C.me.id ? "⚡ " + t("youNext") : t("upNext", { name: pName(nxt) })) : null);
  const kids = [];
  let tools = null;
  const oneLine = st.twist === "oneline";
  if (mine) {
    if (C.my && C.my.rid === st.rid && C.my.k === st.k) {
      // screen rebuilt during my turn: keep the drawing and tools
      const old = C.my.board;
      board.load(C.my.tok);
      const usedLine = oneLine && C.my.tok.includes(OP_E);
      if (!C.my.fin && !usedLine) {
        board.enableInput((arr) => { if (C.my && C.my.board === board && !C.my.fin) C.my.tok.push(...arr); }, myInputOpts());
        board.tool = old.tool || "pen"; board.color = old.color || 0; board.size = old.size ?? 1;
        C.my.board = board;
      }
    } else {
      // If we reloaded mid-turn, pick up whatever the others already saw
      if (C.live && C.live.k === st.k && C.live.tok.length) board.load(C.live.tok);
      startMyTurn(board);
      if (board.tok.length) { C.my.tok = board.tok.slice(); C.my.sent = C.my.tok.length; C.my.resumed = true; }
      else sendHost({ t: "resume", rid: st.rid, k: st.k }); // in case I reloaded mid-turn
    }
    const done = C.my.fin;
    if (st.twist === "blind" && !done) wrap.append(el("div", { class: "over blind" }, t("blindCover")));
    if (done) wrap.append(el("div", { class: "over" }, "✓"));
    const tb = (id, icon, title, fn) => el("button", { "data-t": id, title, onclick: fn }, icon);
    const sel = () => {
      tools.querySelectorAll(".tools button[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === board.tool));
      tools.querySelectorAll(".colors button").forEach((b, i) => b.classList.toggle("on", i === board.color && board.tool !== "eraser"));
      tools.querySelectorAll(".sizes button").forEach((b, i) => b.classList.toggle("on", i === board.size));
    };
    tools = el("div", {},
      oneLine ? el("p", { class: "hint" }, t("oneLineTip")) : el("div", { class: "tools" },
        tb("pen", "✏️", t("tools").pen, () => { board.tool = "pen"; sel(); }),
        tb("fill", "🪣", t("tools").fill, () => { board.tool = "fill"; sel(); }),
        tb("eraser", "🧽", t("tools").eraser, () => { board.tool = "eraser"; sel(); }),
        el("button", { title: t("tools").undo, onclick: () => board.act("undo") }, "↩️"),
        el("button", { title: t("tools").clear, onclick: () => board.act("clear") }, "🗑️")),
      el("div", { class: "colors" }, PAL.map((c, i) => el("button", { style: `background:${c}`, "aria-label": c, onclick: () => { board.color = i; if (board.tool === "eraser") board.tool = "pen"; sel(); } }))),
      el("div", { class: "sizes" }, SIZES.map((s, i) => el("button", { onclick: () => { board.size = i; sel(); } }, el("i", { style: `width:${Math.max(6, s * 0.55)}px;height:${Math.max(6, s * 0.55)}px` })))),
      el("button", { class: "btn teal", disabled: done || null, onclick: () => { finishMyTurn(); render(); } }, t("done")));
    sel();
  } else {
    if (!C.live || C.live.k !== st.k) C.live = { k: st.k, tok: [], board: null };
    board.load(C.live.tok);
    board.k = st.k;
    C.live.board = board;
  }
  // 🎭 secret action: every player sees it, so having it gives nothing away
  const sabBox = el("div", {});
  const canSee = st.sabOn && !mine && !C.tv && st.parts.includes(C.me.id);
  const fillSab = () => {
    sabBox.innerHTML = "";
    const S = C.mySab;
    if (S && !S.fin && S.rid === st.rid && S.k === st.k) {
      sabBox.append(el("div", { class: "sabbar" },
        el("div", { class: "row" }, el("b", { style: "flex:2" }, t("sabGo")), el("span", { id: "sabTime", style: "flex:0;min-width:34px;text-align:right" }, "")),
        el("div", { class: "tbar sab" }, el("i", { id: "sabInk", style: `width:${S.ink * 100}%` })),
        S.mode === "add" ? el("div", { class: "colors" }, PAL.slice(0, 8).map((c, i) => el("button", { style: `background:${c}`, class: overlay.color === i ? "on" : "",
          onclick: (e) => { overlay.color = i; sabBox.querySelectorAll(".colors button").forEach((b, j) => b.classList.toggle("on", j === i)); } }))) : null,
        el("button", { class: "btn imp sm", onclick: () => finishSab() }, t("sabStop"))));
    } else if (canSee) sabBox.append(el("button", { class: "btn ghost sm", onclick: askSab }, t("secretAction")));
  };
  C.updSab = fillSab;
  fillSab();
  if (C.mySab && !C.mySab.fin && C.mySab.rid === st.rid && C.mySab.k === st.k) attachSab();
  if (C.tv) {
    screen(el("div", { class: "drawgrid" }, el("div", {}, top, wrap), el("div", {}, galleryStrip())));
  } else {
    kids.push(top, wrap);
    if (tools) kids.push(tools);
    kids.push(sabBox, peekBox());
    if (!st.parts.includes(C.me.id)) kids.push(el("p", { class: "hint" }, t("newPlayer")));
    kids.push(galleryStrip());
    screen(...kids);
  }
  C.upd = () => {
    C.updGal?.();
    if (mine && C.my?.fin && !wrap.querySelector(".over:not(.blind)")) {
      wrap.querySelector(".blind")?.remove();
      wrap.append(el("div", { class: "over" }, "⏰ " + t("timesUp")));
      const b = tools?.querySelector(".btn.teal"); if (b) b.disabled = true;
    }
  };
}

// ---- vote ----
function voteScreen() {
  const st = C.st, iAmIn = st.parts.includes(C.me.id) && !C.tv, vr2 = st.vr === 2;
  const grid = el("div", { class: "vgrid" });
  const status = el("p", { class: "center muted" });
  const ctrl = el("div", {});
  const mineBox = el("div", { class: "myvotes" });
  if (!C.myVotes || C.myVotes.rid !== st.rid) C.myVotes = { rid: st.rid, vr: st.vr, imp: null, sab: null, best: null };
  if (C.myVotes.vr !== st.vr) { C.myVotes.vr = st.vr; C.myVotes.imp = null; }
  const V = C.myVotes;
  const kinds = vr2 ? ["imp"] : ["imp", ...(st.sabRole ? ["sab"] : []), "best"];
  const label = { imp: t("vImp"), sab: t("vSab"), best: t("vBest") };
  const fillMine = () => {
    mineBox.innerHTML = "";
    if (!iAmIn) return;
    mineBox.append(el("b", {}, t("myVotes") + " "), ...kinds.map((kd) => el("span", { class: "mv " + kd + (V[kd] ? " set" : "") }, label[kd].split(" ")[0] + " " + (V[kd] ? pName(V[kd]) : "—"))));
  };
  const fillGrid = () => {
    grid.innerHTML = "";
    for (const id of vr2 ? C.st.cands : C.st.parts) {
      const p = pObj(id);
      const ks = C.st.order.map((x, k) => (x === id ? k : -1)).filter((k) => k >= 0);
      const pics = el("div", { class: "pics" + (ks.length === 1 ? " one" : "") }, ks.map((k) => {
        const g = C.gal[k];
        return g && !g.sk ? el("img", { src: galImg(k, g), onclick: () => zoomImg(galImg(k, g), p?.name) }) : el("div", { class: "ph" }, g?.sk ? "💤" : "⏳");
      }));
      const isMe = id === C.me.id;
      const btns = iAmIn ? (isMe ? [el("div", { class: "you" }, t("yourCard"))] :
        kinds.filter((kd) => kd !== "imp" || C.st.cands.includes(id)).map((kd) => el("button", { class: "vb " + kd + (V[kd] === id ? " on" : ""),
          onclick: () => { V[kd] = id; sendHost({ t: "vote", to: id, kind: kd }); beep(600, .08); fillGrid(); fillMine(); } }, label[kd]))) : [];
      grid.append(el("div", { class: "vcard" + (Object.values({ a: V.imp, b: V.sab, c: V.best }).includes(id) ? " pick" : "") },
        el("div", { class: "nm" }, avatar(p), el("span", {}, p?.name || "?"), C.st.voted.includes(id) ? el("span", { class: "small muted" }, "✓") : null),
        pics, btns));
    }
  };
  fillGrid(); fillMine();
  screen(el("h2", { class: "center" }, vr2 ? t("voteTitle") : t("voteTime")),
    vr2 ? el("p", { class: "center" }, el("b", {}, t("revote", { names: st.cands.map(pName).join(", ") })))
      : el("p", { class: "center small" }, t("voteSub") + " " + (kinds.length > 1 ? t("voteLegend") : "")),
    !iAmIn && !C.tv ? el("p", { class: "hint" }, t("notInRound")) : null,
    mineBox, status, ctrl, grid, peekBox());
  C.upd = () => {
    const s = C.st;
    const voters = s.parts.filter((id) => pObj(id)?.on || s.voted.includes(id));
    status.textContent = "🗳️ " + t("votesIn", { n: s.voted.length, m: voters.length });
    ctrl.innerHTML = "";
    if (C.isHost && Object.keys(H.sec?.votes || {}).length) ctrl.append(el("button", { class: "btn ghost", onclick: () => hTally() }, "📣 " + t("revealVotes")));
    refresh();
  };
  let gk = "";
  const refresh = () => {
    const k = C.st.voted.join() + "|" + C.st.order.map((x, i) => (C.gal[i] ? C.gal[i].tok.length + "/" + (C.gal[i].sab?.length || 0) : "-")).join();
    if (k !== gk) { gk = k; fillGrid(); }
  };
  C.updGal = refresh;
}

// ---- impostor's last guess ----
function guessScreen() {
  const st = C.st, g = st.guess, isImp = g.imp === C.me.id && !C.tv;
  const p = pObj(g.imp);
  screen(el("div", { class: "reveal" }, el("div", { class: "big" }, "🕵️ " + t("caught", { name: p?.name || "?" }))),
    el("div", { class: "turnbar" }, el("div", { class: "who" }, isImp ? t("lastChance") : t("guessing", { name: p?.name || "?" })), el("div", { class: "timer" })),
    el("div", { class: "tbar" }, el("i")),
    el("div", { class: "choices" }, g.choices.map((w, i) => el("button", { class: "btn " + (isImp ? "imp" : "ghost"), disabled: !isImp || null,
      onclick: (e) => { sendHost({ t: "guess", i }); document.querySelectorAll(".choices .btn").forEach((b) => (b.disabled = true)); e.target.classList.add("pulse"); } }, w))));
  if (isImp) buzz([100, 50, 100]);
  C.upd = null;
}

// ---- round result ----
function resultScreen() {
  const st = C.st, r = st.res, imp = pObj(r.imp), impName = imp?.name || "?";
  let cls = "", head = "", sub = "";
  if (r.aborted) { cls = "none"; head = t("aborted"); sub = r.aborted === "imp" ? t("abortImp") : r.aborted === "few" ? t("abortFew") : ""; }
  else if (r.caught === r.imp && !r.guessOk) { cls = "crew"; head = t("crewWins"); sub = t("impWas", { name: impName }); }
  else if (r.caught === r.imp && r.guessOk) { head = t("impSteal"); sub = t("impWas", { name: impName }); }
  else if (r.tie) { head = t("tieEscape"); sub = t("impWas", { name: impName }); }
  else { head = t("innocent", { name: pName(r.caught) }); sub = t("impWas", { name: impName }); }
  const kids = [el("div", { class: "reveal " + cls },
    el("div", { class: "big" }, head), el("p", {}, sub),
    el("div", {}, t("wordWas") + ":"), el("div", { class: "w" }, r.word))];
  if (r.guessed && r.pick != null && r.choices) kids.push(el("p", { class: "center" }, t("guessed", { name: impName, w: r.choices[r.pick] }) + (r.guessOk ? " ✅" : " ❌")));
  else if (r.caught === r.imp && !r.aborted) kids.push(el("p", { class: "center muted" }, t("noGuess", { name: impName })));
  if (r.sab && !r.aborted) kids.push(el("div", { class: "reveal sabr" }, el("div", { class: "big", style: "font-size:24px" }, t("sabWas", { name: pName(r.sab.id) })),
    el("div", {}, !r.sab.used ? t("sabLazy") : r.sab.caught ? t("sabCaught") : t("sabEscaped"))));
  if (r.best && r.best.length) kids.push(el("div", { class: "card center" }, el("h3", {}, t("bestWas", { names: r.best.map(pName).join(", ") })),
    el("div", { class: "gal", style: "justify-content:center" }, st.order.map((x, k) => [x, k]).filter(([x, k]) => r.best.includes(x) && C.gal[k] && !C.gal[k].sk)
      .map(([x, k]) => el("div", { class: "thumb", onclick: () => zoomImg(galImg(k, C.gal[k]), pName(x)) }, el("img", { src: galImg(k, C.gal[k]) }), el("span", {}, pName(x)))))));
  if (r.imp === C.me.id && !C.tv && !r.aborted) { r.caught === r.imp && !r.guessOk ? buzz(300) : buzz([80, 60, 80, 60, 80]); }
  // sabotaged drawings: before / after
  for (const sb of r.sabs || []) {
    const g = C.gal[sb.k];
    if (!g || g.sk) continue;
    const before = drawingImg(g.tok, galKey(sb.k, g) + ":base");
    kids.push(el("div", { class: "card" }, el("h3", {}, "😈 " + t("sabBy", { name: pName(g.pid), role: sb.role === "imp" ? t("roleImp") : t("roleSab") })),
      el("div", { class: "row" },
        el("div", { class: "thumb", style: "width:auto", onclick: () => zoomImg(before) }, el("img", { src: before, style: "width:100%;height:auto" }), el("span", {}, t("before"))),
        el("div", { class: "thumb", style: "width:auto", onclick: () => zoomImg(galImg(sb.k, g)) }, el("img", { src: galImg(sb.k, g), style: "width:100%;height:auto" }), el("span", {}, t("after"))))));
  }
  // impostor's drawings
  const ks = st.order.map((x, k) => (x === r.imp ? k : -1)).filter((k) => k >= 0 && C.gal[k] && !C.gal[k].sk);
  if (ks.length) kids.push(el("div", { class: "card" }, el("h3", {}, t("impDrawings")),
    el("div", { class: "gal" }, ks.map((k) => el("div", { class: "thumb", onclick: () => zoomImg(galImg(k, C.gal[k]), impName) }, el("img", { src: galImg(k, C.gal[k]) }))))));
  // how everyone voted
  if (!r.aborted && Object.keys(r.votes || {}).length + Object.keys(r.bestVotes || {}).length) kids.push(el("div", { class: "card votes" }, el("h3", {}, t("votesHead")),
    st.parts.map((id) => el("div", {}, el("b", {}, pName(id) + ": "),
      "🕵️ ", r.votes[id] ? pName(r.votes[id]) + (r.votes[id] === r.imp ? " 🎯" : "") : el("span", { class: "muted" }, "—"),
      r.sab ? [" · 😈 ", r.sabVotes?.[id] ? pName(r.sabVotes[id]) + (r.sabVotes[id] === r.sab.id ? " 🎯" : "") : el("span", { class: "muted" }, "—")] : null,
      " · ⭐ ", r.bestVotes?.[id] ? pName(r.bestVotes[id]) : el("span", { class: "muted" }, "—")))));
  kids.push(el("div", { class: "card" }, el("h3", {}, "🏆 " + t("scores")), scoreList(r.gains)));
  if (C.isHost) {
    const last = st.set.rounds && st.round >= st.set.rounds;
    kids.push(el("button", { class: "btn teal", onclick: () => hNext() }, last ? t("finalResults") : t("nextRound")));
    if (!last) kids.push(el("button", { class: "btn ghost", onclick: () => { if (confirm(t("endConfirm"))) hEnd(); } }, "🏁 " + t("endGame")));
  } else kids.push(el("p", { class: "center muted" }, t("waitNext")));
  screen(...kids);
  C.upd = null;
}

// ---- final ----
function finalScreen() {
  const st = C.st;
  const sorted = st.players.slice().sort((a, b) => b.score - a.score);
  const top = sorted[0];
  const tied = sorted.filter((p) => top && p.score === top.score);
  const podium = el("div", { class: "podium" });
  const spots = [[sorted[1], 90, "#b8b8c8", "🥈"], [sorted[0], 130, "#f2b400", "🥇"], [sorted[2], 70, "#d08a4e", "🥉"]];
  for (const [p, h, c, m] of spots) if (p) podium.append(el("div", { style: `min-height:${h}px;background:${c}` }, el("div", {}, m), el("div", { class: "n" }, p.name), el("div", {}, p.score)));
  screen(el("h1", { class: "center" }, "🎉 " + t("gameOver")),
    el("h2", { class: "center" }, tied.length > 1 ? t("tie2") : t("winner", { name: top?.name || "?" })),
    podium,
    el("div", { class: "card" }, scoreList()),
    C.isHost ? el("button", { class: "btn teal", onclick: () => hPlayAgain() }, "🔁 " + t("playAgain")) : el("p", { class: "center muted" }, t("waitNext")));
  if (st.players.length) { beep(660, .12); setTimeout(() => beep(880, .12), 150); setTimeout(() => beep(1100, .25), 300); }
  C.upd = null;
}

// ---------------------------------------------------------------------
//  Start up
// ---------------------------------------------------------------------
(function boot() {
  const l = store.get("di_lang"); if (l === "en" || l === "es") LANG = l;
  const room = (params.get("room") || "").toUpperCase();
  const ps = store.get("di_player");
  if (room) {
    if (ps && ps.code === room && ps.name && now() - ps.ts < 6 * 3600e3) return joinRoom(room, ps.name);
    C.screen = "join";
  } else if (ps && ps.name && now() - ps.ts < 30 * 60e3 && !store.get("di_host")) {
    // came back within 30 minutes (e.g. phone reloaded) → rejoin automatically
    return joinRoom(ps.code, ps.name);
  } else {
    const hs = store.get("di_host");
    if (hs && now() - hs.ts < 30 * 60e3) { H = hs.H; return hostStart(null, true); }
  }
  render();
})();
</script>
</body>
